<!DOCTYPE html>
<html lang="zh-HK">
<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0, maximum-scale=1.0">

<title>家居庫存</title>

<meta name="theme-color" content="#f7f3ee">

<style>

*{
box-sizing:border-box;
margin:0;
padding:0;
-webkit-tap-highlight-color:transparent;
}

:root{
--bg:#f7f3ee;
--card:#ffffff;
--text:#40372f;
--muted:#8d8177;
--primary:#b9825d;
--primary-dark:#986844;
--border:#eee6df;
--soft:#f4eee8;
--danger:#d96b67;
--danger-bg:#fff0ef;
--success:#6d9c71;
--success-bg:#edf7ed;
--warning:#c58a43;
--warning-bg:#fff5e3;
--shadow:0 5px 25px rgba(70,50,35,.07);
}

body.dark{
--bg:#171513;
--card:#24211e;
--text:#f5eee7;
--muted:#aaa098;
--primary:#d09a72;
--primary-dark:#b67c54;
--border:#3a342f;
--soft:#302b27;
--danger:#ef8c87;
--danger-bg:#3a2423;
--success:#8fbd92;
--success-bg:#253527;
--warning:#e0aa63;
--warning-bg:#3b3021;
--shadow:0 5px 25px rgba(0,0,0,.2);
}

body{
font-family:
-apple-system,
BlinkMacSystemFont,
"SF Pro Display",
"Segoe UI",
sans-serif;
background:var(--bg);
color:var(--text);
min-height:100vh;
}

button,
input,
select{
font:inherit;
}

button{
cursor:pointer;
}

.app{
max-width:900px;
margin:0 auto;
padding:20px 18px 110px;
}

header{
display:flex;
align-items:center;
justify-content:space-between;
margin-bottom:24px;
}

.logo-area{
display:flex;
align-items:center;
gap:12px;
}

.logo{
width:55px;
height:55px;
border-radius:18px;
background:linear-gradient(135deg,#f0d4be,#c68e67);
display:flex;
align-items:center;
justify-content:center;
font-size:29px;
box-shadow:var(--shadow);
}

h1{
font-size:28px;
letter-spacing:-.5px;
}

.subtitle{
color:var(--muted);
font-size:13px;
margin-top:3px;
}

.header-actions{
display:flex;
gap:8px;
}

.icon-btn{
width:44px;
height:44px;
border:0;
border-radius:15px;
background:var(--card);
color:var(--text);
box-shadow:var(--shadow);
font-size:19px;
}

.page{
display:none;
}

.page.active{
display:block;
animation:appear .2s ease;
}

@keyframes appear{
from{
opacity:0;
transform:translateY(5px);
}
to{
opacity:1;
transform:translateY(0);
}
}

.section-title{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:13px;
}

.section-title h2{
font-size:21px;
}

.section-title span{
color:var(--muted);
font-size:13px;
}

.dashboard-grid{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:12px;
margin-bottom:22px;
}

.stat-card{
background:var(--card);
border-radius:22px;
padding:18px;
box-shadow:var(--shadow);
}

.stat-icon{
font-size:27px;
margin-bottom:10px;
}

.stat-number{
font-size:28px;
font-weight:750;
}

.stat-label{
color:var(--muted);
font-size:13px;
margin-top:3px;
}

.quick-actions{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:12px;
margin-bottom:24px;
}

.quick{
border:0;
border-radius:20px;
padding:17px;
text-align:left;
background:var(--card);
color:var(--text);
box-shadow:var(--shadow);
}

.quick-icon{
font-size:27px;
margin-bottom:7px;
}

.quick-title{
font-weight:700;
}

.quick-sub{
color:var(--muted);
font-size:12px;
margin-top:3px;
}

.card{
background:var(--card);
border-radius:22px;
padding:18px;
box-shadow:var(--shadow);
margin-bottom:16px;
}

.item-card{
background:var(--card);
border-radius:20px;
padding:16px;
box-shadow:var(--shadow);
margin-bottom:11px;
}

.item-row{
display:flex;
align-items:center;
gap:13px;
}

.item-icon{
width:50px;
height:50px;
border-radius:16px;
background:var(--soft);
display:flex;
align-items:center;
justify-content:center;
font-size:26px;
flex-shrink:0;
}

.item-main{
flex:1;
min-width:0;
}

.item-name{
font-weight:750;
font-size:16px;
}

.item-category{
color:var(--muted);
font-size:12px;
margin-top:3px;
}

.item-qty{
text-align:right;
font-weight:700;
}

.qty-number{
font-size:18px;
}

.qty-unit{
color:var(--muted);
font-size:11px;
}

.status{
display:inline-flex;
align-items:center;
gap:4px;
padding:5px 9px;
border-radius:20px;
font-size:11px;
font-weight:700;
margin-top:8px;
}

.status.ok{
color:var(--success);
background:var(--success-bg);
}

.status.low{
color:var(--warning);
background:var(--warning-bg);
}

.status.out{
color:var(--danger);
background:var(--danger-bg);
}

.item-info{
display:flex;
flex-wrap:wrap;
gap:8px;
margin-top:12px;
padding-top:12px;
border-top:1px solid var(--border);
}

.info-chip{
background:var(--soft);
padding:7px 10px;
border-radius:10px;
font-size:11px;
color:var(--muted);
}

.item-buttons{
display:flex;
gap:7px;
margin-top:12px;
}

.small-button{
flex:1;
border:0;
border-radius:12px;
padding:9px;
background:var(--soft);
color:var(--text);
font-size:13px;
font-weight:600;
}

.small-button.primary{
background:var(--primary);
color:white;
}

.small-button.danger{
background:var(--danger-bg);
color:var(--danger);
}

.search-box{
position:relative;
margin-bottom:14px;
}

.search-box input{
padding-left:43px;
}

.search-icon{
position:absolute;
left:15px;
top:14px;
font-size:16px;
}

input,
select{
width:100%;
border:1px solid transparent;
outline:none;
background:var(--soft);
color:var(--text);
border-radius:14px;
padding:13px 14px;
font-size:15px;
}

input:focus,
select:focus{
border-color:var(--primary);
}

label{
display:block;
font-size:12px;
color:var(--muted);
margin:12px 0 6px;
font-weight:600;
}

.form-grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
}

.full{
grid-column:1 / -1;
}

.primary-button{
width:100%;
border:0;
background:var(--primary);
color:white;
border-radius:15px;
padding:14px;
font-weight:700;
margin-top:16px;
}

.primary-button:active{
background:var(--primary-dark);
}

.cancel-button{
width:100%;
border:0;
background:var(--soft);
color:var(--text);
border-radius:15px;
padding:14px;
font-weight:700;
margin-top:9px;
}

.category-scroll{
display:flex;
gap:8px;
overflow-x:auto;
padding-bottom:4px;
margin-bottom:15px;
}

.category-scroll::-webkit-scrollbar{
display:none;
}

.category-btn{
white-space:nowrap;
border:0;
background:var(--card);
color:var(--text);
border-radius:20px;
padding:9px 13px;
box-shadow:var(--shadow);
font-size:12px;
}

.category-btn.active{
background:var(--primary);
color:white;
}

.empty{
text-align:center;
padding:40px 20px;
color:var(--muted);
}

.empty-icon{
font-size:45px;
margin-bottom:10px;
}

.empty-title{
font-weight:700;
color:var(--text);
margin-bottom:5px;
}

.shopping-row{
display:flex;
align-items:center;
gap:12px;
padding:14px 0;
border-bottom:1px solid var(--border);
}

.shopping-row:last-child{
border-bottom:0;
}

.check{
width:25px;
height:25px;
border-radius:8px;
border:2px solid var(--primary);
background:transparent;
flex-shrink:0;
}

.shopping-name{
flex:1;
}

.shopping-name strong{
display:block;
}

.shopping-name small{
color:var(--muted);
}

.calendar-head{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:18px;
}

.calendar-head button{
border:0;
background:var(--soft);
color:var(--text);
border-radius:12px;
width:40px;
height:40px;
}

.calendar-title{
font-weight:750;
font-size:18px;
}

.calendar-week{
display:grid;
grid-template-columns:repeat(7,1fr);
text-align:center;
color:var(--muted);
font-size:11px;
font-weight:700;
margin-bottom:7px;
}

.calendar-grid{
display:grid;
grid-template-columns:repeat(7,1fr);
gap:5px;
}

.calendar-day{
min-height:58px;
border-radius:13px;
background:var(--soft);
padding:7px 3px;
text-align:center;
cursor:pointer;
}

.calendar-day.empty-day{
background:transparent;
cursor:default;
}

.calendar-day.today{
outline:2px solid var(--primary);
}

.calendar-number{
font-weight:700;
font-size:13px;
}

.calendar-icons{
font-size:13px;
margin-top:6px;
min-height:16px;
}

.calendar-dots{
display:flex;
justify-content:center;
gap:3px;
margin-top:4px;
}

.dot{
width:5px;
height:5px;
border-radius:50%;
background:var(--primary);
}

.timeline-date{
font-weight:750;
margin:17px 0 8px;
font-size:14px;
}

.timeline-entry{
background:var(--card);
border-radius:16px;
padding:13px;
box-shadow:var(--shadow);
margin-bottom:8px;
display:flex;
gap:10px;
align-items:center;
}

.timeline-entry-icon{
font-size:23px;
}

.timeline-entry-main{
flex:1;
}

.timeline-entry-main strong{
font-size:14px;
}

.timeline-entry-main small{
display:block;
color:var(--muted);
margin-top:3px;
}

.total-box{
text-align:center;
padding:25px 10px;
}

.total-label{
color:var(--muted);
font-size:13px;
}

.total-value{
font-size:43px;
font-weight:800;
margin-top:5px;
}

.breakdown-row{
display:flex;
align-items:center;
justify-content:space-between;
padding:13px 0;
border-bottom:1px solid var(--border);
}

.breakdown-left{
display:flex;
align-items:center;
gap:9px;
}

.breakdown-dot{
width:10px;
height:10px;
border-radius:50%;
background:var(--primary);
}

.month-summary{
display:flex;
justify-content:space-between;
padding:14px 0;
border-bottom:1px solid var(--border);
}

.month-summary:last-child{
border-bottom:0;
}

.store-row{
display:flex;
align-items:center;
gap:10px;
padding:12px 0;
border-bottom:1px solid var(--border);
}

.store-row:last-child{
border-bottom:0;
}

.store-name{
flex:1;
font-weight:600;
}

.store-delete{
border:0;
background:var(--danger-bg);
color:var(--danger);
border-radius:10px;
padding:7px 10px;
}

.modal{
position:fixed;
inset:0;
background:rgba(0,0,0,.42);
display:none;
align-items:flex-end;
justify-content:center;
z-index:1000;
}

.modal.show{
display:flex;
}

.modal-sheet{
width:100%;
max-width:650px;
max-height:92vh;
overflow-y:auto;
background:var(--card);
border-radius:28px 28px 0 0;
padding:22px 18px 30px;
animation:slideUp .25s ease;
}

@keyframes slideUp{
from{
transform:translateY(100%);
}
to{
transform:translateY(0);
}
}

.modal-handle{
width:42px;
height:5px;
border-radius:5px;
background:var(--border);
margin:0 auto 18px;
}

.modal-header{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:15px;
}

.modal-header h2{
font-size:21px;
}

.close{
border:0;
background:var(--soft);
color:var(--text);
width:38px;
height:38px;
border-radius:12px;
}

.bottom-nav{
position:fixed;
bottom:0;
left:50%;
transform:translateX(-50%);
width:100%;
max-width:900px;
background:var(--card);
border-top:1px solid var(--border);
display:grid;
grid-template-columns:repeat(4,1fr);
padding:9px 8px calc(9px + env(safe-area-inset-bottom));
z-index:900;
}

.nav-btn{
border:0;
background:transparent;
color:var(--muted);
padding:7px 3px;
font-size:11px;
}

.nav-icon{
font-size:20px;
display:block;
margin-bottom:3px;
}

.nav-btn.active{
color:var(--primary);
font-weight:750;
}

.toast{
position:fixed;
left:50%;
bottom:90px;
transform:translateX(-50%) translateY(20px);
background:#302a25;
color:white;
padding:12px 18px;
border-radius:14px;
font-size:13px;
opacity:0;
pointer-events:none;
transition:.25s;
z-index:2000;
white-space:nowrap;
}

.toast.show{
opacity:1;
transform:translateX(-50%) translateY(0);
}

@media(max-width:500px){

.app{
padding-left:14px;
padding-right:14px;
}

h1{
font-size:25px;
}

.dashboard-grid{
gap:9px;
}

.stat-card{
padding:14px;
}

.stat-number{
font-size:24px;
}

.form-grid{
grid-template-columns:1fr;
}

.full{
grid-column:auto;
}

.calendar-day{
min-height:54px;
}

}

</style>
</head>

<body>

<div class="app">

<header>

<div class="logo-area">

<div class="logo">
🏠
</div>

<div>

<h1>家居庫存</h1>

<div class="subtitle">
知道屋企有咩，只買真正需要嘅嘢
</div>

</div>

</div>

<div class="header-actions">

<button
class="icon-btn"
onclick="toggleDarkMode()">
🌙
</button>

<button
class="icon-btn"
onclick="openSettings()">
⚙️
</button>

</div>

</header>


<!-- HOME -->

<section
id="home"
class="page active">

<div class="dashboard-grid">

<div class="stat-card">

<div class="stat-icon">📦</div>

<div
class="stat-number"
id="homeTotal">
0
</div>

<div class="stat-label">
物品總數
</div>

</div>


<div class="stat-card">

<div class="stat-icon">⚠️</div>

<div
class="stat-number"
id="homeLow">
0
</div>

<div class="stat-label">
需要補貨
</div>

</div>


<div class="stat-card">

<div class="stat-icon">🛒</div>

<div
class="stat-number"
id="homeShopping">
0
</div>

<div class="stat-label">
購物清單
</div>

</div>


<div class="stat-card">

<div class="stat-icon">💰</div>

<div
class="stat-number"
id="homeValue">
$0
</div>

<div class="stat-label">
目前庫存價值
</div>

</div>

</div>


<div class="section-title">

<h2>快速操作</h2>

</div>


<div class="quick-actions">

<button
class="quick"
onclick="openAddItem()">

<div class="quick-icon">
➕
</div>

<div class="quick-title">
新增物品
</div>

<div class="quick-sub">
加入屋企平時會儲存嘅物品
</div>

</button>


<button
class="quick"
onclick="showPage('shopping')">

<div class="quick-icon">
🛒
</div>

<div class="quick-title">
購物清單
</div>

<div class="quick-sub">
睇吓有咩需要買
</div>

</button>

</div>


<div class="section-title">

<h2>⚠️ 需要補貨</h2>

<span
onclick="showPage('inventory')"
style="cursor:pointer">
查看全部 →
</span>

</div>


<div id="homeLowList"></div>

</section>


<!-- INVENTORY -->

<section
id="inventory"
class="page">

<div class="section-title">

<h2>📦 我的庫存</h2>

<button
class="small-button primary"
style="flex:0;padding:9px 13px"
onclick="openAddItem()">
＋ 新增
</button>

</div>


<div class="search-box">

<span class="search-icon">🔍</span>

<input
id="searchInput"
type="search"
placeholder="搜尋物品..."
oninput="renderInventory()">

</div>


<div
class="category-scroll"
id="categoryButtons">
</div>


<div id="inventoryList"></div>

</section>


<!-- SHOPPING -->

<section
id="shopping"
class="page">

<div class="section-title">

<h2>🛒 購物清單</h2>

<span id="shoppingCount">
0 件
</span>

</div>


<div class="card">

<div id="shoppingList"></div>

<button
class="primary-button"
onclick="openAddShopping()">
＋ 加入購物清單
</button>

</div>

</section>


<!-- CALENDAR -->

<section
id="calendar"
class="page">

<div class="section-title">

<h2>📅 購買記錄</h2>

</div>


<div class="card">

<div class="calendar-head">

<button onclick="changeCalendarMonth(-1)">
‹
</button>

<div
class="calendar-title"
id="calendarTitle">
2026年8月
</div>

<button onclick="changeCalendarMonth(1)">
›
</button>

</div>


<div class="calendar-week">

<div>日</div>
<div>一</div>
<div>二</div>
<div>三</div>
<div>四</div>
<div>五</div>
<div>六</div>

</div>


<div
class="calendar-grid"
id="calendarGrid">
</div>

</div>


<div class="section-title">

<h2>🕒 購買時間線</h2>

</div>


<div id="timeline"></div>

</section>


<!-- STATS -->

<section
id="stats"
class="page">

<div class="section-title">

<h2>📊 統計</h2>

</div>


<div class="card">

<div class="total-box">

<div class="total-label">
目前庫存估計價值
</div>

<div
class="total-value"
id="statsValue">
$0
</div>

</div>


<div class="breakdown-row">

<div class="breakdown-left">

<div class="breakdown-dot"></div>

廚房

</div>

<strong id="kitchenValue">$0</strong>

</div>


<div class="breakdown-row">

<div class="breakdown-left">

<div class="breakdown-dot"></div>

浴室

</div>

<strong id="bathroomValue">$0</strong>

</div>


<div class="breakdown-row">

<div class="breakdown-left">

<div class="breakdown-dot"></div>

清潔

</div>

<strong id="cleaningValue">$0</strong>

</div>


<div class="breakdown-row">

<div class="breakdown-left">

<div class="breakdown-dot"></div>

其他

</div>

<strong id="otherValue">$0</strong>

</div>

</div>


<div class="card">

<div class="section-title">

<h2>📅 購買支出</h2>

<span>按月份</span>

</div>

<div id="monthlyStats"></div>

</div>

</section>


<!-- BOTTOM NAV -->

<nav class="bottom-nav">

<button
class="nav-btn active"
data-page="home"
onclick="showPage('home')">

<span class="nav-icon">🏠</span>

首頁

</button>


<button
class="nav-btn"
data-page="inventory"
onclick="showPage('inventory')">

<span class="nav-icon">📦</span>

庫存

</button>


<button
class="nav-btn"
data-page="shopping"
onclick="showPage('shopping')">

<span class="nav-icon">🛒</span>

購物

</button>


<button
class="nav-btn"
data-page="stats"
onclick="showPage('stats')">

<span class="nav-icon">📊</span>

統計

</button>

</nav>

</div>


<!-- MODAL -->

<div
class="modal"
id="modal">

<div class="modal-sheet">

<div class="modal-handle"></div>

<div id="modalContent"></div>

</div>

</div>


<div
class="toast"
id="toast">
已儲存
</div>


<script>

/* =========================================
   HOME STOCK ULTIMATE
========================================= */

const STORAGE_KEY="homeStockUltimateData";

let data=
JSON.parse(localStorage.getItem(STORAGE_KEY))||{

items:[],
shopping:[],
purchases:[],

settings:{
dark:false,

/*
   預設常用商店
   你可以喺設定入面刪除
*/
stores:[
"Costco",
"Walmart",
"No Frills",
"Dollarama",
"Amazon"
]

}

};


/*
   舊版本如果冇 stores
   自動補返
*/

if(!data.settings){
data.settings={
dark:false,
stores:[]
};
}

if(!Array.isArray(data.settings.stores)){
data.settings.stores=[
"Costco",
"Walmart",
"No Frills",
"Dollarama",
"Amazon"
];
}


let selectedCategory="All";

let calendarDate=new Date();

/* =========================================
   TOAST
========================================= */

function toast(message){

const el=document.getElementById("toast");

el.textContent=message;

el.classList.add("show");

setTimeout(()=>{
el.classList.remove("show");
},1800);

}


/* =========================================
   PAGE
========================================= */

function showPage(page){

document
.querySelectorAll(".page")
.forEach(p=>{
p.classList.remove("active");
});


document
.getElementById(page)
.classList.add("active");


document
.querySelectorAll(".nav-btn")
.forEach(btn=>{

btn.classList.remove("active");

if(btn.dataset.page===page){
btn.classList.add("active");
}

});


renderAll();

window.scrollTo({
top:0,
behavior:"smooth"
});

}

function openModal(html){

.getElementById("modalContent")
.innerHTML=html;

document
.getElementById("modal")
.classList.add("show");

}


function closeModal(){

document
.getElementById("modal")

"click",

/* =========================================
   STORE OPTIONS
========================================= */

function storeOptions(selected=""){

const stores=[...data.settings.stores];

let html=`

<option value="">
未選擇商店
</option>

`;

stores.forEach(store=>{

html+=`

<option
value="${escapeHtml(store)}"
${store===selected?"selected":""}>

${escapeHtml(store)}

</option>

`;

});


html+=`

<option value="__NEW_STORE__">
＋ 新增商店...
</option>

`;

return html;

}


/* =========================================
   STORE SELECT
========================================= */

function handleStoreSelect(selectId){

const select=document.getElementById(selectId);

if(!select) return;

if(select.value==="__NEW_STORE__"){

const newStore=prompt(
"請輸入商店名稱："
);

if(newStore){

const clean=newStore.trim();

if(clean){

if(
!data.settings.stores.includes(clean)
){

data.settings.stores.push(clean);

saveData();

}

select.innerHTML=
storeOptions(clean);

}

}

else{

select.innerHTML=
storeOptions("");

}

}

}

/* =========================================
   STATUS
========================================= */

function getStatus(item){

if(item.quantity<=0){

return{
class:"out",
text:"🔴 已用完"
};

}


if(item.quantity<=item.minimum){

return{
class:"low",
text:"⚠️ 需要補貨"
};

}


return{
class:"ok",
text:"🟢 庫存充足"
};

}


/* =========================================
   INVENTORY
========================================= */

function renderInventory(){

const list=
document.getElementById("inventoryList");

if(!list) return;


const search=
(
document.getElementById("searchInput")
?.value||""
)
.toLowerCase()
.trim();


renderCategories();


let items=[...data.items];


if(
selectedCategory!=="全部"
){

items=
items.filter(
i=>i.category===selectedCategory
);

}


if(search){

items=
items.filter(i=>

i.name
.toLowerCase()
.includes(search)

||

i.category
.toLowerCase()
.includes(search)

||

(i.store||"")
.toLowerCase()
.includes(search)

);

}


items.sort((a,b)=>{

const sa=getStatus(a);
const sb=getStatus(b);


if(
sa.class==="out" &&
sb.class!=="out"
)
return -1;


if(
sa.class!=="out" &&
sb.class==="out"
)
return 1;


if(
sa.class==="low" &&
sb.class==="ok"
)
return -1;


if(
sa.class==="ok" &&
sb.class==="low"
)
return 1;


return a.name.localeCompare(
b.name,
"zh-HK"
);

});


if(items.length===0){

list.innerHTML=
emptyState(
"📦",
"暫時沒有物品",
"新增第一件家居物品，就可以開始記錄庫存。"
);

return;

}


list.innerHTML=
items
.map(item=>itemHTML(item))
.join("");

}

/* =========================================

========================================= */

function finishPurchase(
shoppingId,
itemId
){

const shopping=
data.shopping.find(
i=>i.id===shoppingId
);

const item=
data.items.find(
i=>i.id===itemId
);

if(!shopping||!item) return;


const qty=
Number(
document.getElementById(
"boughtQuantity"
).value
)||1;


const price=
Number(
document.getElementById(
"boughtPrice"
).value
)||0;


const store=
document.getElementById(
"boughtStore"
).value;


item.quantity+=qty;

item.price=price;

item.lastBought=today();

item.store=
store==="__NEW_STORE__"
?item.store
:store;


data.purchases.push({

id:Date.now().toString(),

itemId:item.id,

itemName:item.name,

quantity:qty,

price:price,

date:today(),

store:item.store||""

});


data.shopping=
data.shopping.filter(
i=>i.id!==shoppingId
);


saveData();

closeModal();

toast("庫存已更新 ✓");

renderAll();

}

function renderCalendar(){

const grid=
document.getElementById(
"calendarGrid"
);

if(!grid) return;


const year=
calendarDate.getFullYear();

const month=
calendarDate.getMonth();


const monthNames=[
"一月",
"二月",
"三月",
"四月",
"五月",
"六月",
"七月",
"八月",
"九月",
"十月",
"十一月",
"十二月"
];


document.getElementById(
"calendarTitle"
)
.textContent=
year+"年"+monthNames[month];


const first=
new Date(
year,
month,
1
).getDay();


const days=
new Date(
year,
month+1,
0
).getDate();


let html="";


for(
let i=0;
i<first;
i++
){

html+=`
<div class="calendar-day empty-day"></div>
`;

}


for(
let day=1;
day<=days;
day++
){

const date=
formatISO(
new Date(
year,
month,
day
)
);


const purchases=
data.purchases.filter(
p=>p.date===date
);


const isToday=
date===today();


let icons="";


if(purchases.length){

const unique=
[
...new Set(
purchases.map(p=>{

const item=
data.items.find(
i=>i.id===p.itemId
);

return item
?item.icon
:"📦";

})
)
];


icons=
unique
.slice(0,3)
.join(" ");

}


html+=`

<div
class="calendar-day ${
isToday?"today":""
}"
onclick="openCalendarDay('${date}')">

<div class="calendar-number">
${day}
</div>

<div class="calendar-icons">
${icons}
</div>

${
purchases.length
?
`
<div class="calendar-dots">
<div class="dot"></div>
<div class="dot"></div>
</div>
`
:""
}

</div>

`;

}


grid.innerHTML=html;

renderTimeline();

}

/* =========================================
   TIMELINE
========================================= */

function renderTimeline(){

const container=
document.getElementById(
"timeline"
);

if(!container) return;


const sorted=
[...data.purchases]
.sort(
(a,b)=>
new Date(b.date)-
new Date(a.date)
);


if(sorted.length===0){

container.innerHTML=
emptyState(
"📅",
"暫時沒有購買記錄",
"之後嘅購買記錄會顯示喺呢度。"
);

return;

}


const groups={};


sorted.forEach(p=>{

if(!groups[p.date]){
groups[p.date]=[];
}

groups[p.date].push(p);

});


container.innerHTML=
Object.keys(groups)
.map(date=>`

<div class="timeline-date">

${formatDate(date)}

</div>


${groups[date]
.map(p=>`

<div class="timeline-entry">

<div class="timeline-entry-icon">
📦
</div>


<div class="timeline-entry-main">

<strong>
${escapeHtml(p.itemName)}
</strong>

<small>

＋${p.quantity}

${p.store
?" • 🏪 "+escapeHtml(p.store)
:""}

• $${money(p.price)}

</small>

</div>

</div>

`)
.join("")}

`)
.join("");

}


/* =========================================
   STATS
========================================= */

function renderStats(){

const value=
data.items.reduce(
(sum,i)=>
sum+(i.quantity*i.price),
0
);


document.getElementById(
"statsValue"
)
.textContent=
"$"+money(value);


const categories={
廚房:0,
浴室:0,
清潔:0,
其他:0
};


data.items.forEach(item=>{

const v=
item.quantity*item.price;


if(
categories[item.category]!==undefined
){

categories[item.category]+=v;

}else{

categories.其他+=v;

}

});


document.getElementById(
"kitchenValue"
)
.textContent=
"$"+money(categories.廚房);


document.getElementById(
"bathroomValue"
)
.textContent=
"$"+money(categories.浴室);


document.getElementById(
"cleaningValue"
)
.textContent=
"$"+money(categories.清潔);


document.getElementById(
"otherValue"
)
.textContent=
"$"+money(categories.其他);


renderMonthlyStats();

}


/* =========================================
   MONTHLY STATS
========================================= */

function renderMonthlyStats(){

const container=
document.getElementById(
"monthlyStats"
);

if(!container) return;


const months={};


data.purchases.forEach(p=>{

const month=
p.date.substring(0,7);


if(!months[month]){
months[month]=0;
}


months[month]+=
p.quantity*p.price;

});


const keys=
Object.keys(months)
.sort()
.reverse()
.slice(0,12);


if(keys.length===0){

container.innerHTML=
emptyState(
"💰",
"暫時沒有購買數據",
"之後嘅每月消費會顯示喺呢度。"
);

return;

}


container.innerHTML=
keys.map(month=>`

<div class="month-summary">

<span>
${formatMonth(month)}
</span>

<strong>
$${money(months[month])}
</strong>

</div>

`).join("");

}

function exportBackup(){

const json=
JSON.stringify(
data,
null,
2
);


const blob=
new Blob(
[json],
{
type:"application/json"
}
);


const url=
URL.createObjectURL(blob);


const a=
document.createElement("a");

a.href=url;

a.download=
"家居庫存備份-"+
today()+
".json";


a.click();

URL.revokeObjectURL(url);

toast("備份已下載 ✓");

}


/* =========================================
   BACKUP IMPORT
========================================= */

function importBackup(event){

const file=
event.target.files[0];

if(!file) return;


const reader=
new FileReader();


reader.onload=function(){

try{

const imported=
JSON.parse(
reader.result
);


if(
!imported.items ||
!imported.shopping ||
!imported.purchases
){

throw new Error();

}


if(
!confirm(
"匯入呢份備份後，現有資料會被取代。確定嗎？"
)
){

return;

}


data=imported;


if(!data.settings){
data.settings={};
}

if(!Array.isArray(
data.settings.stores
)){

data.settings.stores=[
"Costco",
"Walmart",
"No Frills",
"Dollarama",
"Amazon"
];

}


saveData();

closeModal();

applyTheme();

renderAll();

toast("備份已還原 ✓");

}catch(e){

alert(
"呢份備份檔案無效。"
);

}

};


reader.readAsText(file);

}

/* =========================================
   HELPERS
========================================= */

function today(){

return formatISO(
new Date()
);

}


function formatISO(date){

const y=
date.getFullYear();


const m=
String(
date.getMonth()+1
)
.padStart(2,"0");


const d=
String(
date.getDate()
)
.padStart(2,"0");


return `${y}-${m}-${d}`;

}


function formatDate(date){

if(!date)
return "未記錄";


const parts=
date.split("-");


if(parts.length!==3)
return date;


return (
parts[0]+"年"+
parts[1]+"月"+
parts[2]+"日"
);

}


function formatMonth(month){

const parts=
month.split("-");


const date=
new Date(
Number(parts[0]),
Number(parts[1])-1,
1
);


const names=[
"一月",
"二月",
"三月",
"四月",
"五月",
"六月",
"七月",
"八月",
"九月",
"十月",
"十一月",
"十二月"
];


return (
parts[0]+"年"+
names[date.getMonth()]
);

}


function money(number){

return Number(
number||0
)
.toFixed(2);

}


function emptyState(
icon,
title,
text
){

return `

<div class="empty">

<div class="empty-icon">
${icon}
</div>

<div class="empty-title">
${title}
</div>

<div>
${text}
</div>

</div>

`;

}


function escapeHtml(value){

return String(
value??""
)
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}
